<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantity Measurment App</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div id="root">
      <div class="app-scroll-wrapper">
        <header class="main-header">
          <h1>Welcome To Quantity Measurement</h1>
        </header>
        <main class="container">
          <section class="selection-section">
            <h2>CHOOSE TYPE</h2>
            <div class="category-grid" id="categoryGrid">
              <div class="category-card active" data-category="length">
                <div class="icon-box">
                  <img
                    alt="Length"
                    src="https://img.icons8.com/color/50/ruler.png"
                  />
                </div>
                <span>Length</span>
              </div>
              <div class="category-card" data-category="weight">
                <div class="icon-box">
                  <img
                    alt="Weight"
                    src="https://img.icons8.com/color/50/scales.png"
                  />
                </div>
                <span>Weight</span>
              </div>
              <div class="category-card" data-category="temperature">
                <div class="icon-box">
                  <img
                    alt="Temperature"
                    src="https://img.icons8.com/color/50/thermometer.png"
                  />
                </div>
                <span>Temperature</span>
              </div>
              <div class="category-card" data-category="volume">
                <div class="icon-box">
                  <img
                    alt="Volume"
                    src="https://img.icons8.com/color/50/measuring-cup.png"
                  />
                </div>
                <span>Volume</span>
              </div>
            </div>
          </section>
          <section class="selection-section">
            <h2>CHOOSE ACTION</h2>
            <div class="action-tabs">
              <button class="action-btn active">Comparison</button
              ><button class="action-btn">Conversion</button
              ><button class="action-btn">Arithmetic</button>
            </div>
          </section>
          <section class="conversion-section">
            <div class="conversion-card" style="display: flex; gap: 2rem">
              <div class="input-group" style="z-index: 20">
                <label>FROM</label><input step="any" type="number" value="1" />
                <div class="custom-dropdown">
                  <div class="dropdown-header">
                    <span>Kilometer</span><span class="arrow">▲</span>
                  </div>
                  <div class="dropdown-options">
                    <div class="option-item active">Kilometer</div>
                    <div class="option-item">Meters</div>
                    <div class="option-item">Centimeters</div>
                    <div class="option-item">Millimeters</div>
                    <div class="option-item">Mile</div>
                    <div class="option-item">Yard</div>
                    <div class="option-item">Feet</div>
                    <div class="option-item">Inch</div>
                  </div>
                </div>
              </div>
              <div class="input-group" style="z-index: 10">
                <label>TO</label><input readonly="" type="text" value="1000" />
                <div class="custom-dropdown">
                  <div class="dropdown-header">
                    <span>Meters</span><span class="arrow">▲</span>
                  </div>
                  <div class="dropdown-options">
                    <div class="option-item">Kilometer</div>
                    <div class="option-item active">Meters</div>
                    <div class="option-item">Centimeters</div>
                    <div class="option-item">Millimeters</div>
                    <div class="option-item">Mile</div>
                    <div class="option-item">Yard</div>
                    <div class="option-item">Feet</div>
                    <div class="option-item">Inch</div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
